<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog | Swetha Srikari Maganti</title>
    <meta
      name="description"
      content="A small photo blog from Swetha Srikari Maganti."
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <nav class="site-links" aria-label="Primary links">
          <a href="index.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="photos.html" aria-current="page">Blog</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="photo-blog" aria-label="Photo blog posts">
        <article class="photo-post">
          <div class="photo-card photo-a" role="img" aria-label="Photo for Afternoon Observation">
            <img src="IMG_3461.jpeg" alt="Afternoon Observation" onerror="this.hidden=true">
          </div>
          <div>
            <h2>Afternoon Observation</h2>
          </div>
        </article>
        <article class="photo-post">
          <div class="photo-card photo-b" role="img" aria-label="Photo for Peace and Quiet">
            <img src="IMG_3234.jpeg" alt="Peace and Quiet" onerror="this.hidden=true">
          </div>
          <div>
            <h2>Peace and Quiet</h2>
          </div>
        </article>
        <article class="photo-post">
          <div class="photo-card photo-c" role="img" aria-label="Photo for Hello!">
            <img src="IMG_2735.jpeg" alt="Hello!" onerror="this.hidden=true">
          </div>
          <div>
            <h2>Hello!</h2>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
